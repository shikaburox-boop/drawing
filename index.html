<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Real-time Smooth Canvas</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        h1 { margin: 0 0 5px 0; font-size: 22px; color: #00adb5; }
        #status { margin-bottom: 15px; font-size: 13px; color: #ff4141; }
        #status.connected { color: #00e676; }
        
        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 240px; 
            aspect-ratio: 240 / 320;
        }

        canvas {
            background-color: #000;
            border: 4px solid #393e46;
            border-radius: 8px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.5);
            cursor: crosshair;
            touch-action: none;
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .toolbar {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #25252d;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 270px;
            box-sizing: border-box;
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }

        .palette {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .color-dot {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.1s;
        }
        .color-dot:hover { transform: scale(1.1); }
        .color-dot.active { border-color: #ffffff; transform: scale(1.15); }

        input[type="color"] {
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .slider-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
            font-size: 13px;
        }

        input[type="range"] {
            flex-grow: 1;
            accent-color: #00adb5;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            flex-grow: 1;
            font-size: 13px;
        }
        button#eraserBtn { background-color: #555; }
        button#eraserBtn.active { background-color: #00adb5; box-shadow: 0 0 8px #00adb5;}
        button#clearBtn { background-color: #ff4141; }
        button#clearBtn:hover { background-color: #c70039; }
    </style>
</head>
<body>

    <h1>#ipad พัง</h1>
    <div id="status">🔴 Disconnected</div>

    <div class="canvas-container">
        <canvas id="paintCanvas" width="240" height="320"></canvas>
    </div>

    <div class="toolbar">
        <div class="row">
            <div class="palette">
                <div class="color-dot active" style="background-color: #ffffff;" data-color="#ffffff"></div>
                <div class="color-dot" style="background-color: #ff4141;" data-color="#ff4141"></div>
                <div class="color-dot" style="background-color: #ffeb3b;" data-color="#ffeb3b"></div>
                <div class="color-dot" style="background-color: #00e676;" data-color="#00e676"></div>
                <div class="color-dot" style="background-color: #00adb5;" data-color="#00adb5"></div>
                <input type="color" id="colorPicker" value="#ffffff" title="เลือกสีอื่นๆ">
            </div>
        </div>

        <div class="row">
            <div class="slider-wrapper">
                <span>ขนาดเส้น:</span>
                <input type="range" id="sizeSlider" min="1" max="15" value="3">
                <span id="sizeVal">3</span>
            </div>
        </div>
        
        <div class="btn-group">
            <button id="eraserBtn">🧽 ยางลบ</button>
            <button id="clearBtn">🗑️ ล้างหน้าจอ</button>
        </div>
    </div>

    <script {nonce}>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        const clearBtn = document.getElementById('clearBtn');
        const eraserBtn = document.getElementById('eraserBtn');
        const colorPicker = document.getElementById('colorPicker');
        const colorDots = document.querySelectorAll('.color-dot');
        const sizeSlider = document.getElementById('sizeSlider');
        const sizeVal = document.getElementById('sizeVal');

        let isPainting = false;
        let isEraser = false;
        
        // 🚀 เก็บอาร์เรย์ของจุดพิกัดเพื่อนำมาคำนวณความโค้งสมูท
        let points = []; 

        let savedColor = '#ffffff'; 
        let currentColorRgb565 = 0xFFFF; 

        const ESP32_IP = "192.168.1.114"; 
        const ws = new WebSocket(`ws://${ESP32_IP}:81`);
        ws.binaryType = "arraybuffer";

        ws.onopen = () => {
            statusDiv.innerText = "🟢 Connected";
            statusDiv.className = "connected";
        };
        ws.onclose = () => {
            statusDiv.innerText = "🔴 Disconnected";
            statusDiv.className = "";
        };

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;           
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        function hexToRgb565(hex) {
            const r = parseInt(hex.substring(1, 3), 16);
            const g = parseInt(hex.substring(3, 5), 16);
            const b = parseInt(hex.substring(5, 7), 16);
            return ((r & 0xF8) << 8) | ((g & 0xFC) << 3) | (b >> 3);
        }

        sizeSlider.addEventListener('input', (e) => {
            ctx.lineWidth = e.target.value;
            sizeVal.innerText = e.target.value;
        });

        eraserBtn.addEventListener('click', () => {
            isEraser = !isEraser;
            if (isEraser) {
                eraserBtn.classList.add('active');
                ctx.strokeStyle = '#000000';
                currentColorRgb565 = 0x0000;  
            } else {
                eraserBtn.classList.remove('active');
                ctx.strokeStyle = savedColor;
                currentColorRgb565 = hexToRgb565(savedColor);
            }
        });

        function changeColor(hexColor) {
            savedColor = hexColor;
            if (!isEraser) {
                ctx.strokeStyle = hexColor;
                currentColorRgb565 = hexToRgb565(hexColor);
            }
        }

        colorDots.forEach(dot => {
            dot.addEventListener('click', () => {
                document.querySelector('.color-dot.active')?.classList.remove('active');
                dot.classList.add('active');
                if(isEraser) eraserBtn.click(); 
                changeColor(dot.getAttribute('data-color'));
                colorPicker.value = dot.getAttribute('data-color');
            });
        });

        colorPicker.addEventListener('input', (e) => {
            document.querySelector('.color-dot.active')?.classList.remove('active');
            if(isEraser) eraserBtn.click();
            changeColor(e.target.value);
        });

        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const x = Math.floor((clientX - rect.left) * (canvas.width / rect.width));
            const y = Math.floor((clientY - rect.top) * (canvas.height / rect.height));
            return { x, y };
        }

        function startDrawing(e) {
            isPainting = true;
            const { x, y } = getCoordinates(e);
            points = []; // เคลียร์จุดเดิมเมื่อเริ่มลากเส้นใหม่
            points.push({ x, y });
            
            sendCoordinates(x, y, x, y, currentColorRgb565); 
        }

        function draw(e) {
            if (!isPainting) return;
            e.preventDefault();
            const { x, y } = getCoordinates(e);
            
            points.push({ x, y });

            if (points.length > 2) {
                // 🎯 ไฮไลท์: คำนวณหาจุดกึ่งกลาง (Midpoint) ระหว่างจุดปัจจุบันและจุดก่อนหน้า เพื่อดัดเส้นให้โค้งมน (Smooth)
                const i = points.length - 1;
                const xc = (points[i].x + points[i - 1].x) / 2;
                const yc = (points[i].y + points[i - 1].y) / 2;

                ctx.beginPath();
                ctx.moveTo(points[i - 2].x, points[i - 2].y);
                // ดัดโค้งด้วยพิกัดกำลังสอง (Quadratic Curve)
                ctx.quadraticCurveTo(points[i - 1].x, points[i - 1].y, xc, yc);
                ctx.stroke();

                // ส่งพิกัดเฉลี่ยที่โค้งเนียนแล้วไปให้ ESP32 วาดตาม
                sendCoordinates(Math.floor(points[i - 2].x), Math.floor(points[i - 2].y), Math.floor(xc), Math.floor(yc), currentColorRgb565);
            }
        }

        function stopDrawing() { 
            isPainting = false; 
            points = [];
        }

        function sendCoordinates(x1, y1, x2, y2, color565) {
            if (ws.readyState === WebSocket.OPEN) {
                const buffer = new ArrayBuffer(10);
                const view = new Int16Array(buffer);
                view[0] = x1;
                view[1] = y1;
                view[2] = x2;
                view[3] = y2;
                view[4] = color565;
                ws.send(buffer);
            }
        }

        clearBtn.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (ws.readyState === WebSocket.OPEN) {
                const buffer = new ArrayBuffer(12);
                const view = new Int16Array(buffer);
                view[0] = -1; 
                
                ws.send(buffer);
            }
        });

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        window.addEventListener('touchend', stopDrawing);

        function sendCoordinates(x1, y1, x2, y2, color565) {
            if (ws.readyState === WebSocket.OPEN) {
                const buffer = new ArrayBuffer(12); 
                const view = new Int16Array(buffer);
                
                view[0] = x1;
                view[1] = y1;
                view[2] = x2;
                view[3] = y2;
                view[4] = color565;
                view[5] = parseInt(sizeSlider.value);
                
                ws.send(buffer);
            }
        }
    </script>
</body>
</html>
