<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Real-time Multicolor Canvas</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { margin-bottom: 5px; font-size: 24px; color: #00adb5; }
        #status { margin-bottom: 15px; font-size: 14px; color: #ff4141; }
        #status.connected { color: #00e676; }
        
        canvas {
            background-color: #000;
            border: 4px solid #393e46;
            border-radius: 8px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.5);
            cursor: crosshair;
            touch-action: none;
        }
        
        .palette-container {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            background: #25252d;
            padding: 10px 15px;
            border-radius: 30px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
        }

        .color-dot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.1s, border-color 0.2s;
        }
        .color-dot:hover {
            transform: scale(1.1);
        }
        .color-dot.active {
            border-color: #ffffff;
            transform: scale(1.15);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        .custom-color-wrapper {
            display: flex;
            align-items: center;
            border-left: 2px solid #393e46;
            padding-left: 10px;
            margin-left: 5px;
        }

        input[type="color"] {
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .controls {
            margin-top: 15px;
        }

        button#clearBtn {
            padding: 10px 25px;
            background-color: #ff4141;
            border: none;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button#clearBtn:hover { background-color: #c70039; }
    </style>
</head>
<body>

    <h1>#ipad พัง</h1>
    <div id="status">🔴 Disconnected</div>

    <canvas id="paintCanvas" width="240" height="320"></canvas>

    <div class="palette-container">
        <div class="color-dot active" style="background-color: #ffffff;" data-color="#ffffff"></div>
        <div class="color-dot" style="background-color: #ff4141;" data-color="#ff4141"></div>
        <div class="color-dot" style="background-color: #ffeb3b;" data-color="#ffeb3b"></div>
        <div class="color-dot" style="background-color: #00e676;" data-color="#00e676"></div>
        <div class="color-dot" style="background-color: #00adb5;" data-color="#00adb5"></div>
        <div class="color-dot" style="background-color: #9c27b0;" data-color="#9c27b0"></div>
        
        <div class="custom-color-wrapper">
            <input type="color" id="colorPicker" value="#ffffff" title="เลือกสีอื่นๆ เอง">
        </div>
    </div>

    <div class="controls">
        <button id="clearBtn">ล้างหน้าจอ (Clear)</button>
    </div>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        const clearBtn = document.getElementById('clearBtn');
        const colorPicker = document.getElementById('colorPicker');
        const colorDots = document.querySelectorAll('.color-dot');

        let isPainting = false;
        let lastX = 0;
        let lastY = 0;
        let currentColorRgb565 = 0xFFFF; // เริ่มที่สีขาว

        const ESP32_IP = "192.168.1.114"; 
        const ws = new WebSocket(`ws://${ESP32_IP}:81`);
        ws.binaryType = "arraybuffer";

        ws.onopen = () => {
            statusDiv.innerText = "🟢 Connected";
            statusDiv.className = "connected";
        };

        ws.onclose = () => {
            statusDiv.innerText = "🔴 Disconnected จาก ESP32 (กำลังพยายามเชื่อมต่อใหม่...)";
            statusDiv.className = "";
        };

        // ค่าเริ่มต้นแปรงฝั่งเว็บ
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;           
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // แปลง HEX เป็น RGB565 ส่งให้ ESP32
        function hexToRgb565(hex) {
            const r = parseInt(hex.substring(1, 3), 16);
            const g = parseInt(hex.substring(3, 5), 16);
            const b = parseInt(hex.substring(5, 7), 16);
            return ((r & 0xF8) << 8) | ((g & 0xFC) << 3) | (b >> 3);
        }

        // ฟังก์ชันเปลี่ยนสีที่เลือกใช้งานอยู่
        function changeColor(hexColor) {
            ctx.strokeStyle = hexColor;
            currentColorRgb565 = hexToRgb565(hexColor);
        }

        // จัดการคลิกเลือก 6 สีทางลัด
        colorDots.forEach(dot => {
            dot.addEventListener('click', (e) => {
                // เอาสถานะ active ออกจากปุ่มอื่น แล้วมาใส่ปุ่มที่กด
                document.querySelector('.color-dot.active')?.classList.remove('active');
                dot.classList.add('active');
                
                const selectedColor = dot.getAttribute('data-color');
                changeColor(selectedColor);
                colorPicker.value = selectedColor; // อัปเดตสีในช่องเลือกเองให้ตรงกัน
            });
        });

        // จัดการเมื่อสไลด์เลือกสีเองจากช่องเลือกสี
        colorPicker.addEventListener('input', (e) => {
            // เอาสถานะ active จาก 6 ปุ่มออกไปก่อนเพราะเราเลือกสีเองแล้ว
            document.querySelector('.color-dot.active')?.classList.remove('active');
            changeColor(e.target.value);
        });

        function startDrawing(e) {
            isPainting = true;
            const { x, y } = getCoordinates(e);
            lastX = x;
            lastY = y;
            sendCoordinates(x, y, x, y, currentColorRgb565); 
        }

        function draw(e) {
            if (!isPainting) return;
            e.preventDefault();

            const { x, y } = getCoordinates(e);

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();

            sendCoordinates(lastX, lastY, x, y, currentColorRgb565);

            lastX = x;
            lastY = y;
        }

        function stopDrawing() { isPainting = false; }

        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: Math.floor(clientX - rect.left),
                y: Math.floor(clientY - rect.top)
            };
        }

        // ส่งข้อมูล 10 Bytes
        define: function sendCoordinates(x1, y1, x2, y2, color565) {
            if (ws.readyState === WebSocket.OPEN) {
                const buffer = new ArrayBuffer(10);
                const view = new Int16Array(buffer);
                view[0] = x1;
                view[1] = y1;
                view[2] = x2;
                view[3] = y2;
                view[4] = color565;
                ws.send(buffer);
            }
        }

        clearBtn.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (ws.readyState === WebSocket.OPEN) {
                const buffer = new ArrayBuffer(10);
                const view = new Int16Array(buffer);
                view[0] = -1;
                ws.send(buffer);
            }
        });

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        window.addEventListener('touchend', stopDrawing);
    </script>
</body>
</html>
